<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <defs>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#74B4D9" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007F5F" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a" rx="16" />
  <g transform="translate(40, 30)">
    <path d="M10 45 L 35 10 L 65 10 L 90 45 L 65 80 L 35 80 Z" 
          fill="none" stroke="url(#neonBlue)" stroke-width="2" 
          stroke-linejoin="round" opacity="0.3"/>
    <path d="M10 45 L 45 25 L 65 65 L 90 35" 
          fill="none" stroke="url(#neonBlue)" stroke-width="4.5" 
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="10" cy="45" r="6" fill="#007F5F" filter="url(#glow)"/>
    <circle cx="45" cy="25" r="5" fill="#00f0ff" />
    <circle cx="65" cy="65" r="6" fill="#007F5F" filter="url(#glow)"/>
    <circle cx="90" cy="35" r="5" fill="#EBEBEB" />
  </g>
  <text x="155" y="75" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="44" font-weight="800" fill="#EBEBEB" 
        letter-spacing="2">SYNAPSE</text>
  <text x="160" y="110" 
        font-family="system-ui, -apple-system, monospace, sans-serif" 
        font-size="15" font-weight="600" fill="#74B4D9" 
        letter-spacing="5.5">ANALYTICS ENGINE</text>
</svg>
